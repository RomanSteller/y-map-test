# Full stack: MySQL + Redis + Laravel (php-fpm) + queue worker + nginx (serves
# the built Vue SPA and proxies the API) + the Node/Playwright scraper.
#
#   docker compose up --build
#   open http://localhost:8080   (login: demo@example.com / password)

x-app-env: &app-env
  APP_NAME: "Yandex Reviews"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "base64:sPuEssaWq9z7Yb4O05tZwSSIGbyoXIgrbKWU0gPW2m8="
  APP_URL: "http://localhost:8080"

  # SPA / Sanctum — the SPA is served same-origin by nginx on :8080.
  FRONTEND_URL: "http://localhost:8080"
  SANCTUM_STATEFUL_DOMAINS: "localhost:8080,localhost,127.0.0.1:8080"
  SESSION_DOMAIN: localhost
  SESSION_DRIVER: database
  CORS_ALLOWED_ORIGINS: "http://localhost:8080"

  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: yandex_reviews
  DB_USERNAME: laravel
  DB_PASSWORD: secret

  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  REDIS_HOST: redis
  REDIS_PORT: "6379"

  # Use the real headless-browser scraper in Docker (not the fixture).
  YANDEX_PARSER_DRIVER: headless
  YANDEX_SCRAPER_URL: "http://scraper:3000"
  YANDEX_SCRAPER_TIMEOUT: "600"
  YANDEX_MAX_REVIEWS: "600"

  SEED_USER_EMAIL: demo@example.com
  SEED_USER_PASSWORD: password

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: yandex_reviews
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "33061:3306"   # host access for debugging (optional)

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"   # this container migrates + seeds on boot
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=900", "--sleep=1", "--backoff=30"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      scraper:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - app

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    environment:
      PORT: "3000"
    # A headless browser needs more than the default shared-memory.
    shm_size: "1gb"

volumes:
  mysql-data:
