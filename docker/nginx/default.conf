server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Бэкендовые пути идут через фронт-контроллер Laravel по php-fpm.
    # Сам PHP-файл nginx не читает — он лишь говорит php-fpm, какой файл
    # выполнить (код лежит на файловой системе самого php-fpm).
    location ~ ^/(api|sanctum|login|logout|up) {
        # Сначала подключаем стандартные параметры, потом направляем все
        # запросы на единственный фронт-контроллер Laravel.
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 900;
    }

    # SPA — для history-режима отдаём index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Долгий кэш для ассетов с хэшем в имени.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
