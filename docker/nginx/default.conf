server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Backend paths go through Laravel's front controller via php-fpm.
    # nginx never reads the PHP file itself — it just tells php-fpm which file
    # to run (php-fpm has the code on its own filesystem).
    location ~ ^/(api|sanctum|login|logout|up) {
        # Bring in the standard params first, then point every request at
        # Laravel's single front controller.
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 900;
    }

    # SPA — history-mode fallback to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
